version: '3.8'

services:
  fuegord:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuegord_ignis
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - CARTO_API_KEY=${CARTO_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 800M
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
